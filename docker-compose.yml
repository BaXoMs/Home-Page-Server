version: '3.8'

services:
  fireman-dashboard:
    container_name: fireman-dashboard
    build:
      context: .
      dockerfile: Dockerfile
    image: fireman-dashboard:latest
    ports:
      - "3005:80"
    restart: unless-stopped
    environment:
      - TZ=America/Costa_Rica
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
