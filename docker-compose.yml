services:
  homepage-server:
    container_name: homepage-server
    build:
      context: .
      dockerfile: Dockerfile
    image: homepage-server:latest
    ports:
      - "3005:80"
    restart: unless-stopped
    environment:
      - TZ=America/Costa_Rica
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
